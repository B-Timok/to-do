<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>todo.</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">todo<span class="dot">.</span></h1>
      <p class="date" id="date"></p>
    </header>

    <nav class="days" id="days" aria-label="Pick a day">
      <span class="day-indicator" id="day-indicator" aria-hidden="true"></span>
    </nav>

    <form class="composer" id="composer" autocomplete="off">
      <input
        id="new-todo"
        type="text"
        placeholder="What needs doing? Try @ 3pm or @ fri"
        aria-label="Add a task"
        maxlength="200"
      >
      <span class="parse-chip" id="parse-chip" aria-hidden="true"></span>
      <span class="enter-hint" id="enter-hint" aria-hidden="true">↵ enter</span>
    </form>

    <ul class="list" id="list" aria-live="polite"></ul>

    <p class="empty" id="empty" hidden></p>

    <footer class="footer" id="footer">
      <div class="data">
        <button type="button" id="export">Export</button>
        <button type="button" id="import">Import</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <nav class="filters" id="filters" aria-label="Filter tasks">
        <span class="filter-indicator" id="filter-indicator" aria-hidden="true"></span>
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="done">Done</button>
      </nav>
      <button type="button" class="clear" id="clear-done">Clear done</button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status">
    <span id="toast-msg"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
